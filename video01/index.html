<!DOCTYPE html>
<html>
    <head>
        <title>KI-Tools für effizianteres Arbeiten</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }
            .clip {
                position: absolute;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                opacity: 0;
            }
            #title {
                font-size: 48px;
                color: #333;
                text-align: center;
            }
            #subtitle {
                font-size: 28px;
                color: #666;
                text-align: center;
            }
        </style>
    </head>
    <body data-composition-id="main" data-width="1920" data-height="1080">
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">
            KI-Tools für effizienteres Arbeiten
        </div>
        <div id="subtitle" class="clip" data-start="5" data-duration="5" data-track-index="0">
            Bis zu 50% Zeit sparen mit KI
        </div>
        <script>
            gsap.registerPlugin(ScrollTrigger);
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = gsap.timeline({ paused: true });
            window.__timelines.main.set("#title", { opacity: 1 });
            window.__timelines.main.to("#subtitle", { opacity: 1, duration: 1 }, 5);
        </script>
    </body>
</html>
